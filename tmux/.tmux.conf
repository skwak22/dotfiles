# Set prefix to Ctrl-a instead of the default Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Set 256 colors for better appearance
set -g default-terminal "screen-256color"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Option (Alt) arrow keys to switch panes (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Split windows using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file easily
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Increase scrollback buffer size
set -g history-limit 50000

# Status bar configuration
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-left '#[fg=green][#S] '
set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M #[default]'
