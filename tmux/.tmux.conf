# Set prefix to Ctrl-a instead of the default Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support and reduce scroll speed (default is 5 lines per tick)
set -g mouse on
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Set 256 colors for better appearance
set -g default-terminal "screen-256color"

# Enable extended key reporting so Shift+Enter is forwarded
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Option (Alt) arrow keys to switch panes (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Split windows using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file easily
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Increase scrollback buffer size
set -g history-limit 50000

# Status bar configuration
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-left '#[fg=green][#S] '
set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M #[default]'

# Agent Fleet (wt-fleet) pane headers & keybindings
set -g pane-border-status top
set -g pane-border-format " #[bold,fg=cyan]#{?#{@name},🤖 #{@name},Pane #P}#[default] #{?#{@branch},#[fg=green](🌿 #{@branch})#[default] ,}#[fg=brightblack]#{b:pane_current_path}#[default] "
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=cyan,bold

# Quick layout & fleet status shortcuts (Prefix = Ctrl-a)
bind = select-layout tiled \; display "Tiled panes"
bind M select-layout main-vertical \; display "Main-vertical layout"
bind W display-popup -E -w 85% -h 70% "wt-fleet status --watch"

